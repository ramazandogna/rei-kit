name: Release

# A v* tag is the release. Nothing publishes from a branch push, so main can
# move without shipping.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing is an npm CLI feature and needs a recent one; the
      # version bundled with Node may predate OIDC support.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # The same gate as CI: a tag must not ship what a pull request would
      # have rejected.
      - run: pnpm check

      # npm, not pnpm: the OIDC exchange that trusted publishing depends on
      # lives in the npm CLI. No token — id-token: write above is the whole
      # credential, minted per run and useless anywhere else.
      - run: npm publish --access public --provenance
