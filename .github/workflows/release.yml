name: Release

# A v* tag is the release. Nothing publishes from a branch push, so main can
# move without shipping.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step cuts the GitHub Release for this tag.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing is an npm CLI feature and needs a recent one; the
      # version bundled with Node may predate OIDC support.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # The same gate as CI: a tag must not ship what a pull request would
      # have rejected.
      - run: pnpm check

      # The one command in this project that is not pnpm.
      #
      # pnpm 10's publish has --otp and nothing else: no --provenance, no OIDC.
      # Trusted publishing is an npm CLI feature, and it is what removes the
      # token entirely — id-token: write above is the whole credential, minted
      # per run and useless anywhere else. Everything up to here still runs on
      # pnpm; only the upload speaks npm.
      - run: npm publish --access public --provenance

      # A tag on its own leaves the Releases section empty, which is where anyone
      # looking at the project goes to see what shipped. The notes are the
      # matching CHANGELOG section, so they are written once and cannot drift.
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            $0 ~ "^## " version " "  { inside = 1; next }
            inside && /^## /         { exit }
            inside                   { print }
          ' CHANGELOG.md > notes.md

          # A tag whose version has no CHANGELOG heading is a mistake, not a
          # release with empty notes.
          test -s notes.md || { echo "No CHANGELOG section for $TAG"; exit 1; }

          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
