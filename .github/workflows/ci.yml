name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Separate steps so a red X lands on the check that failed.
      - name: Formatting
        run: pnpm check:format
      - name: Lint
        run: pnpm check:lint
      - name: Types
        run: pnpm type-check
      # The showcase too: it passed a string where SectionHeading wanted a tone
      # object for months, and nothing that type-checked ever looked at it.
      - name: Showcase types
        run: pnpm type-check:showcase
      - name: Tests
        run: pnpm test:ci
      - name: Build
        run: pnpm build-only
