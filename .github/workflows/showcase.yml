name: Showcase

# The storefront. A component nobody can see is a component nobody uses, and
# the kit's newest consumer hand-wrote 737 class attributes against a package
# that already had most of what it needed -- partly because there was no way to
# look at it without cloning the repository.
#
# Published from main rather than from a tag: the showcase describes what the
# package is, not what the last release was, and a gallery that lags the code
# is how a reader ends up trusting something that is no longer true.
#
# The beta: the redesign branch is published beside it at /rei-kit/beta/, so
# it can be reviewed on the real host without replacing the live site. Every
# run builds main at the root and the beta branch under /beta/, whichever of
# the two was pushed. The beta is noindex and its canonicals point at the
# live site, so search engines never see two copies.
on:
  push:
    branches: [main, claude/rei-kit-preview]
  workflow_dispatch:

concurrency:
  group: showcase
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: live
      - uses: actions/checkout@v7
        with:
          ref: claude/rei-kit-preview
          path: beta
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: live/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            live/pnpm-lock.yaml
            beta/pnpm-lock.yaml

      # The prop tables are generated from the source by `showcase:build`, so
      # the page cannot document a component the package no longer ships.
      - name: Build the live showcase
        working-directory: live
        run: pnpm install --frozen-lockfile && pnpm showcase:build
        env:
          SHOWCASE_BASE: /rei-kit/

      - name: Build the beta
        working-directory: beta
        run: pnpm install --frozen-lockfile && pnpm showcase:build
        env:
          SHOWCASE_BASE: /rei-kit/beta/

      - name: Put the beta under /beta/, out of the index
        run: |
          find beta/dist-showcase -name '*.html' -exec \
            sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +
          rm -f beta/dist-showcase/sitemap.xml beta/dist-showcase/robots.txt
          mkdir -p live/dist-showcase/beta
          cp -r beta/dist-showcase/. live/dist-showcase/beta/

      # Needs Pages switched on once, by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # Until that is done this step fails with a 404, which reads like a
      # missing file rather than a missing switch. `enablement: true` was tried
      # and cannot help: turning Pages on needs a token with admin rights, and
      # the one a workflow is given does not have them whatever `permissions`
      # says.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: live/dist-showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
